name: Build Package

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  # ★ 版本号单一来源：build.yml 的 env 与 mkdeb.sh 的入参由这里统一派生，
  #   禁止在别处硬编码（SingleVPN 踩过「包名 2.7、内容 2.8」的坑）。
  # 1.0-1 → 1.1-1：加了设置页开关 + 禁左滑进相机，同时移除日志诊断。
  # ★ 1.1-1 → 1.2-1：修 postinst 里的 sbreload。
  #   1.1-1 装包时 postinst 重启 SpringBoard，把前台的 Sileo 一起杀掉，
  #   dpkg 事务未收尾（status 没写完、lock 没释放）→ 用户手机锁残留 + 半装，
  #   之后任何 deb 都装不上。这是**发出去的坏版本**，必须换号重发，
  #   否则用户会以为是同一个包、不敢再试。
  # ★ 1.2-1 首版 CI 绿了但下载产物后发现第二个缺陷：data.tar 里也打了
  #   ./DEBIAN/postinst（dpkg 会解到根目录 /DEBIAN）。rootless 上 / 只读
  #   → 整个包装不上。也在这一版修掉，所以 1.2-1 没有对外发过。
  # ★ 1.3-1：**诊断版**。1.2-1 实机反馈「禁长按生效、禁左滑进相机没生效」。
  #   长按能拦说明 dylib 已加载、hook 已装上 → 问题在判据没命中。
  #   本版功能与 1.2-1 完全一致，只额外把真实手势现场（类名 / edges /
  #   宿主类名链 / 可压制判定 / 两个开关状态）写到两个位置，用来定位。
  #   定位完这块代码必须整块删除（Tweak.m 里标了「四点五、临时诊断」）。
  # ★ 1.4-1：**修复 + 收尾诊断**。1.3-1 日志给出硬结论：
  #   `_UISystemGestureWindow` 上 8 个边缘手势**没有任何一个 edges 含 Right**，
  #   且所有行 sup 全 0 → 「视图树 + edges」这两个维度同时失效。
  #   根因：相机手势挂在 UISystemGestureView（独立窗口，与锁屏窗口平行），
  #   祖先链里没有 CoverSheet/LockScreen，任何「往上找锁屏」的判据必然落空。
  #   本版换数据源：读手势自己的 description（含 target 类名与 action 名），
  #   出现 camera 即压制，并绕开区域判据（理由见 Tweak.m「四之二」）。
  #   诊断段保留一轮，万一下一轮还要定位；确认修好后再整块删除。
  # ★ 1.5-1：**第二次修复**。1.4-1 装后用户回传日志，得到第二个硬结论：
  #   108 条记录、13 个手势类**全部是 Pan 类**，edges 只有 1/4/15，
  #   8（右边缘）一次都没出现，而相机功能确实生效。
  #   → 相机手势不是 pan 类，被诊断和判据的 `NLWIsPanish` 连续挡了两道。
  #   本版：① 新增 swipe 左滑判据；② 诊断放宽到「系统手势窗口/锁屏窗口上
  #   的任何手势类型」（并记 desc/dir），彻底消掉类型盲区。
  #   同时新增 NLWIsLockScreenWindowHost，覆盖「相机挂在锁屏视图树上」这条。
  # ★ 1.6-1：**第三次修复，也是机制层面的转向**。1.5-1 日志（50 个手势类、
  #   dir 全为 -、camera 0 次）排除了 pan / swipe / 类名三条路，
  #   但暴露了真正的机制：相机入口是 CSHorizontalScrollFailureRecognizer
  #   （CSCoverSheetView 上、默认 enabled=NO、target 是 CSScrollGestureController）。
  #   ★ 前三版的压制手段只有 enabled=NO —— 对它完全无效，因为它本来就是 NO，
  #     系统在检测到水平滑动时才 setEnabled:YES 打开。
  #   本版改 hook -[UIGestureRecognizer setEnabled:]，直接拦「启用」这个动作，
  #   并保留压制循环里的即时压制作为双保险（hook 管将来，这里管现在）。
  # ★ 1.7-1：**第四次修复，换掉了整条思路**。1.6-1 日志（8 次 blocked=1，
  #   而相机照样打开）证明「相机入口是某个我能拦住的手势」这个假设本身不成立。
  #   答案来自逆向一份现成插件（com.cydia.love.xtyh 1.7）：
  #   它不 hook 任何手势，只让 CSQuickActionsViewController 的 -hasCamera
  #   返回 NO —— 系统认为设备没有相机，相机页不加载，左滑无从触发。
  #   反汇编证据：0x6fd4 取类名、0x6fe8/0x700c 加载 hasFlashlight/hasCamera
  #   两个 selref，对应 hook 函数 0x736c/0x7374 均为 `mov w0,#0; ret`。
  #   本版只跟 hasCamera（不动手电筒），开关关闭时转发原实现（实时生效，
  #   不留恢复负担）。代价：锁屏相机按钮也会一起消失，交付说明里写明。
  # ★ 1.8-1：**第五次修复**。1.7-1 实机反馈「左滑照样进相机」——
  #   只 hook `-hasCamera` 管的是**按钮显不显示**，管不到「相机页要不要挂载」。
  #   第二份参考插件（com.yccameraflight 1.1「隐藏相机手电筒，禁用左滑」）
  #   解开后答案完整：它 hook 的是**三个**方法，第三个才是关键 ——
  #     SpringBoard -lockScreenCameraSupported  →  NO
  #   反汇编证据（__text @0x7e6c，共 160 字节；__objc_selrefs 恰好 3 项）：
  #     0x7e78 adr "CSQuickActionsViewController" → 0x7e8c/0x7ea8 hook
  #            hasCamera / hasFlashlight（均 mov w0,#0; ret）
  #     0x7ec4 adr "SpringBoard" → 0x7ed4 selref lockScreenCameraSupported
  #            → 0x7f04 也是 mov w0,#0; ret
  #   本版加上第三个 hook，实例方法与类方法都探测（不确定它挂在哪张表上），
  #   装不上时扫描全类把真正的宿主写进日志 —— 下次不用再猜。
  # ★ 1.9-1：**第六次修复，换掉整条实现路径**。1.8-1 用户实测仍不生效，
  #   而同一台机器上 com.yccameraflight 1.1 实测生效。两份产物功能已等价，
  #   差别只在实现：它用 MSHookMessageEx 且**完全不校验签名**，
  #   我用自实现 hook + 严格 `B@:`/`c@:` 前缀匹配 ——
  #   真机编码常是 `B16@:` / `B@:8`，被判成"签名异常"而静默跳过。
  #   本版照抄它的机制：MSHookMessageEx 优先（dlsym 取符号，绝不 dlopen）、
  #   签名判据放宽为「无参即可」、失败回退自实现、三条路径都写日志。
  #   并且按用户要求拆成三个独立开关：
  #     BlockFlashlight → hasFlashlight / BlockCameraButton → hasCamera /
  #     BlockCameraSwipe → lockScreenCameraSupported
  # ★ 2.0-1：**第七次修复，修上一版自己引入的两个缺陷**。
  #   1.9-1 实测生效（三个 hook 方向正确），但暴露出两个设计问题：
  #   ① 「禁用锁屏长按换壁纸」被做成了事实上的总开关：
  #      gEnabled 出现在 NLW_CAM_HOOK_BODY 宏里和所有手势判据里，
  #      用户关掉长按那一项，相机/手电筒三项立刻全部失效。
  #      修法：新增独立总开关 MasterEnabled，在 NLWLoadSwitches() 里
  #      做**掩码**（总开关关 → 把四个子开关全压成 NO），
  #      所有既有判据一个字都不用改，语义自动变正确；
  #      同时把 gEnabled 从相机 hook 宏和手势判据里彻底摘掉。
  #   ② 「禁用锁屏相机按钮」关闭后按钮出现了，但长按打不开相机。
  #      根因：hasCamera（按钮显示）与 lockScreenCameraSupported（相机能力）
  #      在系统层面是同一个开关 —— 后者返回 NO 时系统认定本机不支持
  #      锁屏相机，按钮的 action 也一起失效。
  #      修法：让状态自洽 —— 只要左滑被禁，按钮就一起隐藏
  #      （(gBlockCameraButton || gBlockCameraSwipe)），
  #      宁可少一个按钮，也不给一个按不动的按钮。
  #      已经查证（Apple 官方文档 + 多个资料源）：系统不存在「只禁左滑
  #      而保留相机按钮」的开关，越狱插件层面同样是一刀切。
  VERSION: 2.0-1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  # ---------------------------------------------------------------------
  # 第一道闸：源码级静态校验。不依赖工具链，秒级完成。
  #
  # ★ 检查项以「运行期会崩」为主，不只查「编不过」。
  #   SingleVPN v2.3 那四个 bug 全部能通过编译，静态 lint 一条都抓不到，
  #   最终导致用户手机进安全模式。所以这里的重点是崩宿主维度：
  #     - 每个 hook 是否整体包 @try/@catch
  #     - orig 转发前是否判空
  #     - hook 安装是否区分「自己的实现」与「继承来的」（否则污染父类）
  #     - 是否下钻子视图（会误伤通知/手电筒长按）
  #     - 热路径是否写盘（watchdog 会杀进程）
  # ---------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify architecture constraints
        run: |
          set -e
          echo "--- 架构约束：不得依赖私有 selector ---"
          # 本项目的核心设计就是「只用公开 API」，一旦有人加了私有符号，
          # 就会重新引入「签名猜错 → 崩宿主」的风险。
          if grep -nE '@selector\((_|setWallpaper|deactivateWallpaper)' Tweak.m; then
            echo "✗ 出现私有 selector，违反本项目架构约束"
            exit 1
          fi
          echo "✓ 无私有 selector"

      - name: Source self-check
        run: |
          set -e
          python3 tools/check_source.py

      # ★ 反向验证：证明上面那些检查项「真的在跑」。
      #   本项目已经踩过三次「闸门自己坏掉还报绿」的坑：
      #     · 正则只匹配空参数表 → 报「调用 0 处」却 OK
      #     · 子串判断假通过（ldid_DISABLED 含 ldid）
      #     · 盲扫 tar 把二进制里的 0x78 当成 PAX 头
      #   只有「注入违规 → 检查项必须非 0」才能证明判据有效。
      - name: Verify checks actually fire (negative test)
        run: |
          set -e
          python3 tools/verify_negative.py

  # ---------------------------------------------------------------------
  # 构建：**不安装 Theos**。
  #
  # 用户明确要求过「别用安装 theos 这个方案了，之前构建其他的 deb 很快」。
  # 实测：Setup Theos 680s → 零 Theos 全流程约 24s。
  # 本项目更简单：没有 Logos 语法，连 logos.pl 都不用下载。
  #
  # 只用：xcrun clang 编 dylib → codesign 自签 → mkdeb.sh 拼 deb。
  # ---------------------------------------------------------------------
  build:
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          set -e
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (arm64e / roothide)
        run: |
          set -e
          sh devkit/build.sh arm64e iphoneos-arm64e "$VERSION"
          cp .build/out/*.deb .

      - name: Build (arm64 / rootless)
        run: |
          set -e
          sh devkit/build.sh arm64 iphoneos-arm64 "$VERSION"
          cp .build/out/*.deb .

      - name: Report packages
        run: |
          set -e
          echo "--- 产物 ---"
          ls -l *.deb
          for f in *.deb; do
            echo ""
            echo "== $f =="
            echo "size   : $(wc -c < "$f")"
            echo "sha256 : $(shasum -a 256 "$f" | cut -d' ' -f1)"
          done

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.VERSION }}
          path: "*.deb"
          if-no-files-found: error